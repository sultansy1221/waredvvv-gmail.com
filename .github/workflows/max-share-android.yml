name: Build Max Share Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/max-share-android/**"
      - ".github/workflows/max-share-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android Lint and build APK
        run: gradle -p apps/max-share-android :app:lintDebug :app:assembleDebug --stacktrace

      - name: Record APK checksum
        run: |
          APK="apps/max-share-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          stat -c 'APK size: %s bytes' "$APK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-Share-2.3.1-debug-APK
          path: apps/max-share-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
